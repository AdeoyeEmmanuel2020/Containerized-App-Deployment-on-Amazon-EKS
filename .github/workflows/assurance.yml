name: EKS workload assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eks-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assure:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Install test dependencies
        run: python -m pip install --requirement src/requirements.txt pytest==9.0.1

      - name: Run application tests
        run: pytest -q

      - name: Build container image
        run: docker build --tag eks-reference:${{ github.sha }} src

      - name: Scan repository configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: table

      - name: Scan container image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: eks-reference:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Render Kubernetes resources
        run: kubectl kustomize k8s/base > rendered-manifests.yaml

      - name: Assert immutable workload image reference
        run: |
          grep -E 'image: .+@sha256:[a-f0-9]{64}$' k8s/base/deployment.yaml

      - name: Assert restricted workload controls
        run: |
          grep -q 'runAsNonRoot: true' k8s/base/deployment.yaml
          grep -q 'readOnlyRootFilesystem: true' k8s/base/deployment.yaml
          grep -q 'allowPrivilegeEscalation: false' k8s/base/deployment.yaml
          grep -q 'automountServiceAccountToken: false' k8s/base/deployment.yaml
