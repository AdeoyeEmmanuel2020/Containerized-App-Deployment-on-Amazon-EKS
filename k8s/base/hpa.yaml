apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eks-reference
  namespace: eks-reference
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eks-reference
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
